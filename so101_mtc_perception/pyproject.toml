[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "so101_mtc_perception"
version = "0.1.0"
description = "Block detection and camera geometry for SO-101 pick and place: plain Python, no ROS"
requires-python = ">=3.10"
dependencies = ["numpy"]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools]
packages = ["so101_mtc_perception"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# the tests also run from a plain checkout, without installing the package (system Python, no venv)
pythonpath = ["."]
