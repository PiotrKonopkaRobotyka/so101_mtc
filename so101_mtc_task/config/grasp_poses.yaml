# The grasp and place pose generator of so101_mtc_task (ADR 0003): the only source of these values. The kinematic
# facts (the shoulder_pan axis, the arm plane's offset, wrist_roll's zero and limits, the tcp, the fixed jaw's side)
# come from the URDF and the SRDF instead. Metres and degrees; distances from the shoulder_pan axis.
/**:
  ros__parameters:
    grasp_poses:
      arm_group: arm  # SRDF group: shoulder_pan, the three pitch joints and wrist_roll, base_link → tcp
      gripper_group: gripper  # SRDF group of the moving jaw
      tcp_frame: tcp  # the poses are poses of this frame (so101_mtc_description, ADR 0003)
      # Grasp families: a block up to max_radii[i] from the shoulder_pan axis is grasped with the approach tilted by
      # tilts[i] from vertical, leaning away from the base: top-down, then the smallest tilt that reaches (ADR 0003,
      # with its update on these limits).
      tilts: [0.0, 15.0, 30.0]
      max_radii: [0.23, 0.29, 0.35]
      pregrasp_distance: 0.05  # pre-grasp and retreat: back along the approach
      lift_distance: 0.05  # lift and pre-place: straight up
      # The descent stops with the tcp this far from the block's centre towards the fixed jaw, so that the fixed jaw
      # clears the block; closing then pushes the block onto the fixed jaw, under the tcp (ROB-48)
      approach_gap: 0.0036
      place_clearance: 0.003  # the held block's lowest point above the table when the gripper opens
