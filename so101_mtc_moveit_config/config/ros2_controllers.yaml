# ros2_control controllers of the SO-101, loaded by the controller manager (in simulation, mujoco_ros2_control's
# ros2_control_node). config/moveit_controllers.yaml maps MoveIt onto the same controllers;
# test/test_moveit_config.py checks that the two agree.
controller_manager:
  ros__parameters:
    update_rate: 100  # Hz
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController
    gripper_controller:
      type: parallel_gripper_action_controller/GripperActionController

arm_controller:
  ros__parameters:
    joints: [shoulder_pan, shoulder_lift, elbow_flex, wrist_flex, wrist_roll]
    command_interfaces: [position]
    state_interfaces: [position, velocity]
    # MTC's time-parameterised trajectories can end at about 1e-3 rad/s instead of exactly 0, which the controller
    # rejects by default (joint_trajectory_controller 4.42); MoveIt's reference configs (Panda, Fanuc) allow it too
    allow_nonzero_velocity_at_trajectory_end: true

# The gripper closes toward a target past the block and reports success once the jaw stops on it (allow_stalling,
# ADR 0002), so the grasp does not depend on the block's size. The servo limits the force (in MuJoCo, Menagerie's
# forcerange of 2.94 N·m) and keeps pushing while the target stays past the block, so the grip holds through a lift.
gripper_controller:
  ros__parameters:
    joint: gripper
    allow_stalling: true
    stall_velocity_threshold: 0.01  # rad/s: slower than this counts as stopped
    stall_timeout: 0.3  # s stopped before the goal succeeds
    goal_tolerance: 0.01  # rad
